<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatting Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            margin: 20px;
        }
        
        .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-radius: 18px;
            border-bottom-left-radius: 5px;
            padding: 0.75rem 1rem;
            max-width: 70%;
            word-wrap: break-word;
        }

        /* Markdown formatting styles */
        .message-content strong {
            font-weight: bold;
            color: #2c3e50;
        }

        .message-content em {
            font-style: italic;
            color: #7f8c8d;
        }

        .message-content .chat-header {
            margin: 10px 0 5px 0;
            font-weight: bold;
            color: #e74c3c;
        }

        .message-content h1.chat-header {
            font-size: 1.2em;
            border-bottom: 2px solid #e74c3c;
            padding-bottom: 5px;
        }

        .message-content h2.chat-header {
            font-size: 1.1em;
            border-bottom: 1px solid #e74c3c;
            padding-bottom: 3px;
        }

        .message-content h3.chat-header {
            font-size: 1em;
            color: #c0392b;
        }

        .message-content .list-item {
            margin: 5px 0;
            padding-left: 10px;
        }

        .message-content .list-number {
            font-weight: bold;
            color: #e74c3c;
            margin-right: 8px;
        }

        .message-content .bullet {
            color: #e74c3c;
            margin-right: 8px;
        }

        .message-content .list-content {
            line-height: 1.4;
        }

        .message-content code {
            background: #f8f9fa;
            padding: 2px 4px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            color: #e74c3c;
        }

        .message-content pre {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            border-left: 4px solid #e74c3c;
            margin: 10px 0;
            overflow-x: auto;
        }

        .message-content pre code {
            background: none;
            padding: 0;
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Disaster Management Chatbot - Formatting Preview</h1>
    <p>This shows how the AI responses will be formatted in the chat interface:</p>
    
    <div class="message-content" id="formatted-content">
        <!-- Content will be loaded here -->
    </div>

    <script>
        function formatMarkdown(text) {
            // Convert markdown-like formatting to HTML
            let formatted = text
                // Bold text **text** -> <strong>text</strong>
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                // Italic text *text* -> <em>text</em>
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                // Numbered lists
                .replace(/^(\d+)\.\s+(.+)$/gm, '<div class="list-item"><span class="list-number">$1.</span> <span class="list-content">$2</span></div>')
                // Bullet points
                .replace(/^[-•]\s+(.+)$/gm, '<div class="list-item"><span class="bullet">•</span> <span class="list-content">$1</span></div>')
                // Headers ### Header -> <h3>Header</h3>
                .replace(/^###\s+(.+)$/gm, '<h3 class="chat-header">$1</h3>')
                // Headers ## Header -> <h2>Header</h2>
                .replace(/^##\s+(.+)$/gm, '<h2 class="chat-header">$1</h2>')
                // Headers # Header -> <h1>Header</h1>
                .replace(/^#\s+(.+)$/gm, '<h1 class="chat-header">$1</h1>')
                // Line breaks
                .replace(/\n/g, '<br>')
                // Code blocks ```code``` -> <code>code</code>
                .replace(/```([^`]+)```/g, '<pre><code>$1</code></pre>')
                // Inline code `code` -> <code>code</code>
                .replace(/`([^`]+)`/g, '<code>$1</code>');
            
            return formatted;
        }

        // Sample formatted response
        const sampleResponse = `### Current Disaster Situations Summary

#### 1. **Ebola Outbreak in Democratic Republic of Congo**
- **Classification**: Relief
- **Cost**: $10-30 million (for immediate relief efforts)
- **Time**: Declared on 4 September 2025
- **Details**: 28 suspected cases and 15 deaths (including 4 health workers) reported in Kasai Province.

#### 2. **Flash Floods in Sierra Leone**
- **Classification**: Relief
- **Cost**: Estimated $100M to $500M (preliminary figure)
- **Time**: Between 31 August and 5 September 2025
- **Details**: 17 communities affected in 7 districts. Over 11,080 people from 2,216 households affected.

### Key Observations:
- **Ebola Outbreak** and **Flash Floods in Sierra Leone** are critical relief situations
- **Afghan Earthquake** necessitates both relief and recovery efforts
- **Cost estimates** are preliminary and may rise based on detailed assessments`;

        // Apply formatting
        document.getElementById('formatted-content').innerHTML = formatMarkdown(sampleResponse);
    </script>
</body>
</html>
