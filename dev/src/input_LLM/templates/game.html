<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario's Disaster Management Adventure</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            font-family: 'Press Start 2P', monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .game-container {
            position: relative;
            width: 800px;
            height: 600px;
            border: 4px solid #fff;
            background: #000;
        }
        
        #gameCanvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }
        
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        .start-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #00ff00;
            color: #000;
            border: 3px solid #fff;
            padding: 15px 30px;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            cursor: pointer;
            pointer-events: all;
            box-shadow: 0 0 0 2px #000;
        }
        
        .start-button:hover {
            background: #00cc00;
        }
        
        .support-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffff00;
            color: #000;
            border: 3px solid #fff;
            padding: 15px 30px;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            cursor: pointer;
            pointer-events: all;
            box-shadow: 0 0 0 2px #000;
        }
        
        .support-button:hover {
            background: #cccc00;
        }
        
        .speech-bubble {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            color: #000;
            padding: 15px 20px;
            border: 3px solid #000;
            border-radius: 10px;
            font-size: 10px;
            max-width: 400px;
            text-align: center;
            line-height: 1.4;
            pointer-events: all;
            z-index: 20;
        }
        
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 10px solid #fff;
        }
        
        .mushroom-power {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            color: #fff;
            text-shadow: 2px 2px 0 #000;
            z-index: 15;
        }
        
        .emoji-location {
            position: absolute;
            font-size: 24px;
            cursor: pointer;
            pointer-events: all;
            z-index: 5;
            transition: transform 0.2s;
        }
        
        .emoji-location:hover {
            transform: scale(1.2);
        }
        
        .chat-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        
        .chat-content {
            background: #fff;
            color: #000;
            padding: 30px;
            border: 4px solid #000;
            border-radius: 10px;
            max-width: 500px;
            text-align: center;
            font-size: 12px;
            line-height: 1.6;
        }
        
        .chat-button {
            background: #00ff00;
            color: #000;
            border: 3px solid #000;
            padding: 10px 20px;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            cursor: pointer;
            margin-top: 20px;
        }
        
        .completion-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ffff00;
            color: #000;
            padding: 30px;
            border: 4px solid #000;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
            display: none;
            z-index: 200;
        }
        
        .ok-button {
            background: #00ff00;
            color: #000;
            border: 3px solid #000;
            padding: 10px 20px;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            cursor: pointer;
            margin-top: 15px;
        }
        
        .ok-button:hover {
            background: #00cc00;
        }
        
        .refresh-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff0000;
            color: #fff;
            border: 3px solid #fff;
            padding: 15px 30px;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            cursor: pointer;
            pointer-events: all;
            box-shadow: 0 0 0 2px #000;
            display: none;
        }
        
        .refresh-button:hover {
            background: #cc0000;
        }
        
        .back-to-home-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #ff6b35;
            color: #fff;
            border: 3px solid #fff;
            padding: 10px 20px;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            cursor: pointer;
            pointer-events: all;
            box-shadow: 0 0 0 2px #000;
            z-index: 25;
        }
        
        .back-to-home-button:hover {
            background: #e55a2b;
        }
        
        .back-to-home-button-always {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #ff6b35;
            color: #fff;
            border: 3px solid #fff;
            padding: 10px 20px;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            cursor: pointer;
            pointer-events: all;
            box-shadow: 0 0 0 2px #000;
            z-index: 25;
        }
        
        .back-to-home-button-always:hover {
            background: #e55a2b;
        }
        
        @keyframes sparkle {
            0%, 100% { 
                opacity: 0; 
                transform: scale(0.5);
            }
            50% { 
                opacity: 1; 
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div class="ui-overlay">
            <button class="start-button" id="startButton">START</button>
            <button class="support-button" id="supportButton" style="display: none;">I SUPPORT</button>
            <button class="refresh-button" id="refreshButton" style="display: none;">REFRESH</button>
            <button class="back-to-home-button" id="backToHomeButton" style="display: none;">🏠 BACK TO HOME</button>
            <button class="back-to-home-button-always" id="backToHomeButtonAlways">🏠 HOME</button>
            
            <div class="speech-bubble" id="speechBubble" style="display: none;">
                Princess Peach 👑 I am coming! But I have to save a few people first.. let me explore!🍄🍄🍄
            </div>
            
            <div class="mushroom-power" id="mushroomPower" style="display: none;">
                🍄 x<span id="mushroomCount">0</span>
            </div>
        </div>
        
        <!-- Emoji locations will be added dynamically -->
        <div id="emojiContainer"></div>
    </div>
    
    <!-- Chat Modal -->
    <div class="chat-modal" id="chatModal">
        <div class="chat-content">
            <div id="chatText"></div>
            <button class="chat-button" id="chatButton">Continue to Disaster Management</button>
        </div>
    </div>
    
    <!-- Completion Popup -->
    <div class="completion-popup" id="completionPopup">
        <div>You have completed a challenge Mario!</div>
        <div>You get 5 mushroom power! 🍄</div>
        <button class="ok-button" id="okButton">Lets Go!</button>
    </div>
    
    <script>
        // Include the game.js content here
        const context = {{ context | tojson | safe }};
    </script>
    <script src="/static/game.js"></script>
</body>
</html>
